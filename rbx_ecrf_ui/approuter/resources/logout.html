<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>eCRF - Logged out</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: "72", Arial, Helvetica, sans-serif;
            background: #f5f6f7;
            color: #32363a;
        }
        .card {
            background: #fff;
            padding: 2.5rem 2rem;
            border-radius: 1rem;
            box-shadow: 0 0 1rem rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 22rem;
            width: calc(100% - 2rem);
        }
        h1 { font-size: 1.5rem; margin: 0 0 0.5rem; }
        p { margin: 0 0 1.5rem; }
        a {
            display: inline-block;
            padding: 0.6rem 1.5rem;
            border-radius: 0.5rem;
            background: #0070f2;
            color: #fff;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>eCRF</h1>
        <p>You have been logged out.</p>
        <a href="./">Log in again</a>
    </div>
</body>
</html>
